<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Costo total de un automóvil</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <h1>Ejercicio 14: Costo total de un automóvil</h1>
    <p class="enunciado">Cálculo con precio base de $35.000.000, ganancia del 12% e impuesto del 6%.</p>

    <input type="number" id="precio" value="35000000" placeholder="Precio vehículo">
    <input type="number" id="ganancia" value="12" placeholder="% Ganancia">
    <input type="number" id="impuesto" value="6" placeholder="% Impuesto">

    <div class="caja" id="resultado"></div>

    <script src="14-costo-automovil.js"></script>
</body>
</html>
